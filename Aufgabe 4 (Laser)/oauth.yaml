apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth
  template:
    metadata:
      labels:
        app: oauth
    spec:
      containers:
        - name: oauth
          image: python:3.12-slim
          command:
            - /bin/sh
            - -c
            - "pip install --no-cache-dir flask && python /code/oauth_server.py"
          ports:
            - containerPort: 2019
          volumeMounts:
            - name: code
              mountPath: /code
      volumes:
        - name: code
          configMap:
            name: oauth-code
---
apiVersion: v1
kind: Service
metadata:
  name: oauth
spec:
  type: NodePort
  selector:
    app: oauth
  ports:
    - name: http
      port: 2019
      targetPort: 2019
      nodePort: 2019
